
{% load static %}

<section class="praaz-property-search" id="property-search">

    <div class="praaz-search-heading">

        <h2>
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m16 16 4 4"></path>
            </svg>
            Search Properties
        </h2>


    </div>


    <form action="{% url 'search_properties' %}"
          method="GET"
          class="praaz-search-form"
          id="praazSearchForm">

        <!-- PROPERTY TYPE -->
        <div class="praaz-search-field">

            <span class="praaz-field-icon">⌂</span>

            <select name="property_type" aria-label="Property type">

                <option value="">Property Type</option>
                <option value="Residential Apartment">Residential Apartment</option>
                <option value="Fully Furnished Apartment">Fully Furnished Apartment</option>
                <option value="Independent House">Independent House</option>
                <option value="Villa">Villa</option>
                <option value="Office Space">Office Space</option>
                <option value="Commercial Shop">Commercial Shop</option>
                <option value="Plot">Plot / Land</option>

            </select>

        </div>


        <!-- LOCATION -->
        <div class="praaz-search-field">

            <span class="praaz-field-icon">⌖</span>

            <select name="location" aria-label="Location">

                <option value="">Location</option>
                <option value="Delhi">Delhi</option>
                <option value="Noida">Noida</option>
                <option value="Greater Noida">Greater Noida</option>
                <option value="Gurugram">Gurugram</option>

            </select>

        </div>


        <!-- PROPERTY NAME -->
        <div class="praaz-search-field">

            <span class="praaz-field-icon">⌕</span>

            <input type="search"
                   name="keyword"
                   placeholder="Property name..."
                   aria-label="Property name">

        </div>


        <!-- SEARCH BUTTON -->
        <button type="submit" class="praaz-search-submit">

            <span>Search Properties</span>

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
            </svg>

        </button>

    </form>

</section>

<script src="{% static 'js/property_search.js' %}" defer></script>
